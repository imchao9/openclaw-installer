---
- name: Validate Codex and OpenClaw on target Macs
  hosts: openclaw_macs
  gather_facts: false
  vars:
    remote_run_dir: "/Users/{{ ansible_user | default('mac') }}/openclaw-installer-run"
    local_report_dir: "scripts/ansible/reports"
    validation_report_name: "validation-report.json"
    validate_codex: "1"
    validate_openclaw: "1"
    repair_openclaw_config: "0"
    check_openclaw_config_shape: "0"
    codex_timeout_seconds: "45"
    codex_validation_mode: "endpoint"
    openclaw_timeout_seconds: "45"
    openclaw_test_model: ""
    codex_hello_prompt: "你好你是谁"
    openclaw_hello_prompt: "你好你是谁"
    expected_text: ""

  tasks:
    - name: Create remote report directory without Python
      ansible.builtin.raw: |
        /bin/mkdir -p "{{ remote_run_dir }}/reports"
        /bin/chmod 700 "{{ remote_run_dir }}/reports"
      changed_when: false

    - name: Run Codex/OpenClaw validation without Ansible Python
      ansible.builtin.script:
        cmd: ../../../installer-core/scripts/validate-agent-configs.sh
        executable: /bin/bash
      environment:
        VALIDATE_CODEX: "{{ validate_codex }}"
        VALIDATE_OPENCLAW: "{{ validate_openclaw }}"
        REPAIR_OPENCLAW_CONFIG: "{{ repair_openclaw_config }}"
        CHECK_OPENCLAW_CONFIG_SHAPE: "{{ check_openclaw_config_shape }}"
        CODEX_TIMEOUT_SECONDS: "{{ codex_timeout_seconds }}"
        CODEX_VALIDATION_MODE: "{{ codex_validation_mode }}"
        OPENCLAW_TIMEOUT_SECONDS: "{{ openclaw_timeout_seconds }}"
        OPENCLAW_TEST_MODEL: "{{ openclaw_test_model }}"
        CODEX_HELLO_PROMPT: "{{ codex_hello_prompt }}"
        OPENCLAW_HELLO_PROMPT: "{{ openclaw_hello_prompt }}"
        EXPECTED_TEXT: "{{ expected_text }}"
        VALIDATION_REPORT_PATH: "{{ remote_run_dir }}/reports/{{ validation_report_name }}"
      register: validation_result
      changed_when: false
      failed_when: false

    - name: Show validation output
      ansible.builtin.debug:
        var: validation_result.stdout_lines

    - name: Read validation report without remote Python
      ansible.builtin.raw: |
        /bin/cat "{{ remote_run_dir }}/reports/{{ validation_report_name }}"
      register: validation_report_content
      changed_when: false
      when: validation_result is defined

    - name: Ensure local validation report directory exists
      ansible.builtin.file:
        path: "{{ local_report_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Save validation report locally
      ansible.builtin.copy:
        content: "{{ validation_report_content.stdout }}"
        dest: "{{ local_report_dir }}/{{ inventory_hostname }}/{{ validation_report_name }}"
        mode: "0600"
      delegate_to: localhost
      when: validation_report_content is defined
