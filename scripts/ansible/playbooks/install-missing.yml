---
- name: Install only missing OpenClaw checkpoints
  hosts: openclaw_macs
  gather_facts: false
  vars:
    remote_run_dir: "/Users/{{ ansible_user | default('mac') }}/openclaw-installer-run"
    install_force_selected_phases: true
    install_extra_apps: false
    validate_after_install: true

  tasks:
    - name: Ensure remote report directory exists
      ansible.builtin.file:
        path: "{{ remote_run_dir }}/reports"
        state: directory
        mode: "0700"

    - name: Run pre-install checkpoint scan from synced package
      ansible.builtin.shell: |
        set -euo pipefail
        scanner="{{ remote_run_dir }}/install-files/installer-core/scripts/check-install-checkpoints.sh"
        if [ ! -x "$scanner" ]; then
          scanner="/tmp/check-install-checkpoints.sh"
        fi
        bash "$scanner" \
          --run-dir "{{ remote_run_dir }}" \
          --output "{{ remote_run_dir }}/reports/pre-install-report.json" \
          --plan "{{ remote_run_dir }}/reports/install-plan.env"
      args:
        executable: /bin/bash
      register: pre_scan_result
      changed_when: false

    - name: Show pre-install plan
      ansible.builtin.debug:
        var: pre_scan_result.stdout_lines

    - name: Execute selected install phases from plan
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ remote_run_dir }}"
        . reports/install-plan.env
        : "${PLAN_INSTALL_NODE:=0}"
        : "${PLAN_INSTALL_CORE_APPS:=0}"
        : "${PLAN_INSTALL_EXTRA_APPS:=0}"
        : "${PLAN_INSTALL_DINGTALK:=0}"
        : "${PLAN_FIX_PATH:=0}"
        : "${PLAN_REPAIR_OPENCLAW:=0}"
        : "${PLAN_CONFIGURE_DOUBAO:=0}"

        json_escape() {
          LC_ALL=C LANG=C perl -0pe 's/\\/\\\\/g; s/"/\\"/g; s/\n/\\n/g; s/\r/\\r/g; s/\t/\\t/g'
        }

        phase_rows=""
        overall_status=0
        install_log_dir="reports/install-logs"
        install_result_json="reports/install-result.json"
        mkdir -p "$install_log_dir"

        append_phase_result() {
          phase_name="$1"
          exit_code="$2"
          log_file="$3"
          if [ "$exit_code" = "0" ]; then
            phase_status="pass"
          else
            phase_status="fail"
            overall_status=1
          fi
          tail_text="$(tail -n 80 "$log_file" 2>/dev/null || true)"
          row="$(printf '{'
          printf '"phase":"%s",' "$(printf '%s' "$phase_name" | json_escape)"
          printf '"status":"%s",' "$phase_status"
          printf '"exit_code":%s,' "$exit_code"
          printf '"log":"%s",' "$(printf '%s' "$log_file" | json_escape)"
          printf '"tail":"%s"' "$(printf '%s' "$tail_text" | json_escape)"
          printf '}')"
          if [ -z "$phase_rows" ]; then
            phase_rows="$row"
          else
            phase_rows="$phase_rows,$row"
          fi
        }

        write_install_result() {
          if [ "$overall_status" = "0" ]; then
            summary_status="pass"
          else
            summary_status="fail"
          fi
          {
            printf '{\n'
            printf '  "schema_version": 1,\n'
            printf '  "generated_at": "%s",\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf '  "host": "%s",\n' "$(hostname 2>/dev/null | json_escape)"
            printf '  "user": "%s",\n' "$(whoami 2>/dev/null | json_escape)"
            printf '  "status": "%s",\n' "$summary_status"
            printf '  "plan": {\n'
            printf '    "run_base": %s,\n' "$([ "$PLAN_RUN_BASE" = "1" ] && printf true || printf false)"
            printf '    "install_node": %s,\n' "$([ "$PLAN_INSTALL_NODE" = "1" ] && printf true || printf false)"
            printf '    "install_core_apps": %s,\n' "$([ "$PLAN_INSTALL_CORE_APPS" = "1" ] && printf true || printf false)"
            printf '    "install_extra_apps": %s,\n' "$([ "$PLAN_INSTALL_EXTRA_APPS" = "1" ] && printf true || printf false)"
            printf '    "install_dingtalk": %s,\n' "$([ "$PLAN_INSTALL_DINGTALK" = "1" ] && printf true || printf false)"
            printf '    "fix_path": %s,\n' "$([ "$PLAN_FIX_PATH" = "1" ] && printf true || printf false)"
            printf '    "repair_openclaw": %s,\n' "$([ "$PLAN_REPAIR_OPENCLAW" = "1" ] && printf true || printf false)"
            printf '    "configure_doubao": %s,\n' "$([ "$PLAN_CONFIGURE_DOUBAO" = "1" ] && printf true || printf false)"
            printf '    "run_codex_cli": %s,\n' "$([ "$PLAN_RUN_CODEX_CLI" = "1" ] && printf true || printf false)"
            printf '    "run_cliproxy": %s,\n' "$([ "$PLAN_RUN_CLIPROXY" = "1" ] && printf true || printf false)"
            printf '    "run_secrets": %s,\n' "$([ "$PLAN_RUN_SECRETS" = "1" ] && printf true || printf false)"
            printf '    "run_cliproxy_config": %s,\n' "$([ "$PLAN_RUN_CLIPROXY_CONFIG" = "1" ] && printf true || printf false)"
            printf '    "reasons": "%s"\n' "$(printf '%s' "${PLAN_REASONS:-}" | json_escape)"
            printf '  },\n'
            printf '  "phases": [%s]\n' "$phase_rows"
            printf '}\n'
          } > "$install_result_json"
          echo "Install result written to: $install_result_json"
        }

        run_phase() {
          phase_name="$1"
          shift
          log_file="$install_log_dir/${phase_name}.log"
          echo "== Running install phase: $phase_name =="
          set +e
          "$@" 2>&1 | tee "$log_file"
          phase_rc="${PIPESTATUS[0]}"
          set -e
          append_phase_result "$phase_name" "$phase_rc" "$log_file"
          echo "== Install phase $phase_name exited with $phase_rc =="
        }

        did_work=0
        force_value=0
        if [ "{{ install_force_selected_phases | bool }}" = "True" ]; then
          force_value=1
        fi

        if [ "$PLAN_INSTALL_NODE" = "1" ]; then
          did_work=1
          run_phase base-node bash -lc 'cd install-files && env INSTALL_PHASE=base SKIP_APPS=1 SKIP_CODEX_CLI=1 SKIP_OPENCLAW_FIX=1 SKIP_OPENCLAW_SETUP=1 SKIP_OFFICE_SKILLS=1 SKIP_CLIPROXY=1 SKIP_POWER=1 SKIP_AUTOSTART=1 SKIP_DOUBAO=1 SKIP_WEIXIN_LAUNCHER=1 bash install-new-macbook.sh'
        fi

        if [ "$PLAN_INSTALL_CORE_APPS" = "1" ]; then
          did_work=1
          run_phase base-core-apps bash -lc 'cd install-files && env INSTALL_PHASE=base SKIP_BASE_PKGS=1 SKIP_CODEX_CLI=1 SKIP_OPENCLAW_FIX=1 SKIP_OPENCLAW_SETUP=1 SKIP_OFFICE_SKILLS=1 SKIP_CLIPROXY=1 SKIP_POWER=1 SKIP_AUTOSTART=1 SKIP_WEIXIN_LAUNCHER=1 bash install-new-macbook.sh'
        fi

        if [ "$PLAN_INSTALL_EXTRA_APPS" = "1" ] && [ "{{ install_extra_apps | bool }}" = "True" ]; then
          did_work=1
          run_phase extra-apps bash -lc 'cd install-files && env INSTALL_PHASE=extras bash install-new-macbook.sh'
        fi

        if [ "$PLAN_INSTALL_DINGTALK" = "1" ]; then
          did_work=1
          run_phase dingtalk bash -lc 'bundle_dir="install-files/openclaw-team"; [ -d "$bundle_dir" ] || bundle_dir="install-files/openclaw team"; dmg="$(find "$bundle_dir" -maxdepth 1 -iname "*DingTalk*.dmg" -print -quit)"; test -n "$dmg"; bash install-files/installer-core/scripts/install-dingtalk.sh "$dmg"'
        fi

        if [ "$PLAN_REPAIR_OPENCLAW" = "1" ]; then
          did_work=1
          run_phase openclaw-repair bash -lc 'cd install-files && env INSTALL_PHASE=base SKIP_BASE_PKGS=1 SKIP_APPS=1 SKIP_CODEX_CLI=1 SKIP_DOUBAO=1 SKIP_WEIXIN_LAUNCHER=1 SKIP_OPENCLAW_SETUP=1 SKIP_OFFICE_SKILLS=1 SKIP_CLIPROXY=1 SKIP_POWER=1 SKIP_AUTOSTART=1 bash install-new-macbook.sh'
        fi

        if [ "$PLAN_CONFIGURE_DOUBAO" = "1" ] && [ "$PLAN_INSTALL_CORE_APPS" != "1" ]; then
          did_work=1
          run_phase doubao-config bash -lc 'cd install-files && bash installer-core/scripts/configure-doubao-input.sh'
        fi

        if [ "$PLAN_FIX_PATH" = "1" ] && [ "$PLAN_RUN_CODEX_CLI" != "1" ]; then
          did_work=1
          run_phase path-only bash -lc 'cd install-files && env INSTALL_PHASE=codex-cli SKIP_CODEX_CLI=1 bash install-new-macbook.sh'
        fi

        if [ "$PLAN_RUN_BASE" = "1" ] && [ "$PLAN_INSTALL_NODE" != "1" ] && \
           [ "$PLAN_INSTALL_CORE_APPS" != "1" ] && [ "$PLAN_INSTALL_DINGTALK" != "1" ] && \
           [ "$PLAN_FIX_PATH" != "1" ] && [ "$PLAN_REPAIR_OPENCLAW" != "1" ]; then
          did_work=1
          run_phase openclaw-wrapper-base-legacy \
            env FORCE="$force_value" \
              RUN_BASE=1 \
              RUN_SECRETS=0 \
              RUN_CLIPROXY_CONFIG=0 \
              RUN_VALIDATE=0 \
              bash install-openclaw.sh --skip-validate
        fi

        if [ "$PLAN_RUN_SECRETS" = "1" ] || [ "$PLAN_RUN_CLIPROXY_CONFIG" = "1" ]; then
          did_work=1
          run_phase openclaw-wrapper-config \
            env FORCE="$force_value" \
              RUN_BASE=0 \
              RUN_SECRETS="$PLAN_RUN_SECRETS" \
              RUN_CLIPROXY_CONFIG="$PLAN_RUN_CLIPROXY_CONFIG" \
              RUN_VALIDATE=0 \
              bash install-openclaw.sh --skip-validate
        fi

        if [ "$PLAN_RUN_CODEX_CLI" = "1" ]; then
          did_work=1
          run_phase codex-cli bash -lc 'cd install-files && INSTALL_PHASE=codex-cli bash install-new-macbook.sh'
        fi

        if [ "$PLAN_RUN_CLIPROXY" = "1" ]; then
          did_work=1
          run_phase cliproxy bash -lc 'cd install-files && INSTALL_PHASE=cliproxy bash install-new-macbook.sh'
        fi

        if [ "$did_work" = "0" ]; then
          echo "No missing install phases detected."
        fi
        write_install_result
        exit "$overall_status"
      args:
        executable: /bin/bash
      register: install_result
      changed_when: "'No missing install phases detected.' not in install_result.stdout"
      failed_when: false

    - name: Show install output
      ansible.builtin.debug:
        var: install_result.stdout_lines

    - name: Run post-install checkpoint scan
      ansible.builtin.shell: |
        set -euo pipefail
        bash "{{ remote_run_dir }}/install-files/installer-core/scripts/check-install-checkpoints.sh" \
          --run-dir "{{ remote_run_dir }}" \
          --output "{{ remote_run_dir }}/reports/post-install-report.json" \
          --plan "{{ remote_run_dir }}/reports/post-install-plan.env"
      args:
        executable: /bin/bash
      register: post_scan_result
      changed_when: false

    - name: Show post-install plan
      ansible.builtin.debug:
        var: post_scan_result.stdout_lines

    - name: Run model validation after install when enabled
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ remote_run_dir }}/install-files"
        INSTALL_PHASE=validate bash install-new-macbook.sh
      args:
        executable: /bin/bash
      environment:
        VALIDATION_REPORT_PATH: "{{ remote_run_dir }}/reports/validation-report.json"
      register: validation_result
      changed_when: false
      failed_when: false
      when: validate_after_install | bool

    - name: Show validation output
      ansible.builtin.debug:
        var: validation_result.stdout_lines
      when: validate_after_install | bool
